<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Agentic AI learning path: prompt and context, tools and MCP, RAG and memory, single agent, multi-agent systems, production">
